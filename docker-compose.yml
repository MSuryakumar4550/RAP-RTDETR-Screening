version: "3.8"

services:
  rap-cv-reasoning-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rap-cv-reasoning-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DEFAULT_CONFIDENCE_THRESHOLD=0.40
    volumes:
      - ./weights:/app/weights:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
